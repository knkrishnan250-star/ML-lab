services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./experiments.db
      SECRET_KEY: change-this-in-production
      MLFLOW_TRACKING_URI: sqlite:///./mlflow.db
    volumes:
      - ./backend:/app
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
